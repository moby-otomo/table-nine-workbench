[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "table-nine-script-workbench"
version = "0.1.0"
description = "Local-first development tools for Uncles in Space Three-Seat Inquiry scripts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2,<3",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "streamlit>=1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
